name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tag matches __version__
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          PYVER=$(python -c "from app import __version__; print(__version__)")
          echo "tag=$TAG py=$PYVER"
          if [ "$VER" != "$PYVER" ]; then
            echo "Tag version ($VER) != app.__version__ ($PYVER)"
            exit 1
          fi

      - name: Build with PyInstaller
        run: pyinstaller build_exe.spec --noconfirm

      - name: Stage onefile exe + updater zip
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $exe = Join-Path $PWD "dist\小宝蔬菜汇总.exe"
          if (-not (Test-Path $exe)) { throw "missing exe: $exe" }
          # ASCII copy for GitHub asset download (Chinese names corrupt on some runners)
          $exeOut = Join-Path $PWD "xiaobao-veg-v$ver.exe"
          Copy-Item $exe $exeOut -Force
          # Zip keeps updater path: 小宝蔬菜汇总/小宝蔬菜汇总.exe
          $stage = Join-Path $PWD "_release_stage\小宝蔬菜汇总"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe (Join-Path $stage "小宝蔬菜汇总.exe") -Force
          $zip = Join-Path $PWD "xiaobao-veg-v$ver.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $PWD "_release_stage\小宝蔬菜汇总") -DestinationPath $zip -Force
          Get-Item $exeOut, $zip | Format-List FullName, Length

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xiaobao-veg-v*.exe
            xiaobao-veg-v*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
